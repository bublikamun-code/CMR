# Production Docker Compose Configuration
# Usage: docker compose -f docker-compose.production.yml up -d
# 
# Key differences from docker-compose.yml:
# - Backend port NOT exposed to host
# - Environment loaded from .env.production (keep outside git)
# - SSL certificates mounted for HTTPS
# - Stricter resource limits
# - Health checks enabled
#
# Before the first start:
#   bash scripts/generate_keys.sh > .env.production
#   bash scripts/setup_ssl.sh <domain> <email>
#   edit server_name in nginx/https.conf

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: crm-backend-prod
    restart: unless-stopped
    env_file: .env.production
    # DO NOT expose backend port to host in production
    expose: ["8000"]
    volumes:
      # Data only - never mount over /app, that would shadow the application code.
      - crm-data-prod:/app/data
      - ./server_snapshot/uploads:/app/uploads
      - ./server_snapshot/logs:/app/logs
    # `deploy.resources` is Swarm-only and silently ignored by `docker compose up`.
    # These top-level keys are the ones Compose actually enforces.
    cpus: 2
    mem_limit: 1g
    mem_reservation: 512m
    networks:
      - crm-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: crm-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # TLS config. Switch to ./nginx/http.conf to run without certificates.
      # Requires ssl/cert.pem and ssl/key.pem - create them with
      #   bash scripts/setup_ssl.sh <domain> <email>
      - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # The HSTS `map` must sit in the http context, which only loads conf.d/*.conf.
      - ./nginx/snippets/hsts-map.conf:/etc/nginx/conf.d/00-hsts-map.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      # Webroot for Let's Encrypt renewal over plain HTTP.
      - ./certbot-webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    # Was `cpus: '512m'` under deploy.reservations - invalid for CPU (that is a
    # memory suffix), which made this whole file fail to parse.
    cpus: 1
    mem_limit: 256m
    mem_reservation: 128m
    networks:
      - crm-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: PostgreSQL for production (instead of SQLite)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: crm-postgres-prod
  #   restart: unless-stopped
  #   env_file: .env.production
  #   environment:
  #     POSTGRES_DB: crm_db
  #     POSTGRES_USER: crm_user
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - crm-postgres-prod:/var/lib/postgresql/data
  #   networks:
  #     - crm-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U crm_user"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  crm-data-prod:
    driver: local
  # crm-postgres-prod:
  #   driver: local

networks:
  crm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
