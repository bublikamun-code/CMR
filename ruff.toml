# Конфигурация ruff для CRM «Свет в доме».
#
# Зачем этот файл появился: до Фазы 3 конфига не было ни в проекте, ни выше по
# дереву, поэтому `ruff check .` работал на дефолтах конкретной версии ruff
# и выдавал 664 замечания — из них 243 ложных срабатывания B008 на FastAPI
# `Depends()` и 257 чисто стилистических UP* (Optional[X] -> X | None).
# Ни гейтом, ни ориентиром такой прогон быть не мог, а набор правил молча
# менялся бы при обновлении ruff.
#
# Здесь правила закреплены явно: включены те, что ловят настоящие дефекты
# (неиспользуемые и неопределённые имена, наивные даты, блокирующий I/O
# в async, проглоченные исключения), и сознательно не включены те, что дают
# массовую стилистическую переписку без изменения поведения.
#
# Проверка:  .venv/bin/ruff check .
# Автофикс:  .venv/bin/ruff check . --fix
# Формат:    .venv/bin/ruff format   (пока не входит в гейт)

target-version = "py312"
line-length = 120

# Node-инструмент визуальной проверки: не Python, линтеровать нечего.
extend-exclude = ["tools/visual-check"]

[lint]
select = [
    "F",        # pyflakes: F401/F811/F841 — неиспользуемые имена, переопределения.
                # Именно F811 нашёл затенение `html` в email_cleaner, из-за которого
                # письма только-в-HTML молча не импортировались.
    "E9",       # синтаксические ошибки — минимальный порог работоспособности.
    "B",        # bugbear: изменяемые дефолты, поздние привязки замыканий.
    "S",        # bandit: безопасность (проглоченные исключения, хардкод секретов, SQL).
    "DTZ",      # наивные даты. Конвенция проекта — aware UTC (migrations/0003):
                # SQLite хранит DateTime строкой и сравнивает лексикографически,
                # поэтому смесь форматов ломает сортировку и фильтры просрочек.
    "ASYNC",    # блокирующий I/O внутри async-хендлеров (воркеров всего два).
    "RUF",      # implicit Optional, устаревшие noqa, лишние проверки ключей.
    "TRY",      # тип исключения должен соответствовать ошибке, raise без контекста.
    "C4",       # лишние аллокации в comprehension.
    "SIM",      # упрощения, не меняющие поведение.
    "PIE",
    "PERF",     # очевидные потери производительности.
    "LOG",      # логирование исключений.
    "FLY",      # конкатенация строк вместо f-string.
    "PLR1722",  # sys.exit() вместо алиаса.
    "I",        # порядок импортов. Чисто механическое правило, есть автофикс.
]

ignore = [
    # FastAPI-идиома: Depends()/Query()/File(...) обязаны стоять в дефолтах
    # аргументов — по ним фреймворк и строит внедрение зависимостей.
    # 243 ложных срабатывания на проекте.
    "B008",
    # Комментарии, строки и docstring'и проекта на русском: RUF001/002/003
    # принимают кириллические «а», «е», «о», «с», «р», «х» за «похожие на
    # латиницу» и дают 1443 замечания, которые невозможно и незачем исправлять.
    "RUF001", "RUF002", "RUF003",
    # TRY003 требует выносить длинные сообщения в собственные классы исключений.
    # В FastAPI текст ошибки живёт в HTTPException(detail=...) и адресован
    # пользователю интерфейса — 24 замечания без пользы.
    "TRY003",
]

# Осознанно НЕ включены (каждое — отдельная задача, а не часть гейта):
#   UP006/UP035/UP045 — 257 переписываний аннотаций (List -> list, Optional -> |).
#       Механическая модернизация синтаксиса: поведения не меняет, но трогает
#       каждый роутер и раздует diff перед выкаткой на прод.
#   BLE001 — 28 мест с `except Exception`. Часть из них намеренная (глобальный
#       обработчик в main.py, защита cron-цикла), часть — настоящая дыра.
#       Требует разбора по одному, а не массового игнора.
#   E (кроме E9), W, N, D, ANN, PTH, PLR (кроме PLR1722) — оформление и нейминг.

[lint.per-file-ignores]
# assert — это и есть механизм проверок pytest, а не «забытый» raise.
# (E712 на `== True` / `== False` в фильтрах SQLAlchemy не включён в select:
# Python-операторы `is True` / `is False` в SQL не транслируются.)
# S105/S107/S108 — тестовые заглушки («test-secret-key...», /tmp/a.pdf), а не
# боевые секреты; S608 — conftest накатывает DDL из фикстуры схемы прода.
"tests/*" = ["S101", "S105", "S107", "S108", "S608"]

# Миграции строят SQL из имён таблиц и колонок, прописанных в коде самой
# миграции: внешнего ввода там нет по определению, а параметризовать имя
# таблицы в SQLite невозможно.
"migrations/*" = ["S608"]

# Единственный модуль, который сам ходит наружу по произвольным URL.
# S310 (url open) подавлен не точечно, а по файлу, потому что защита здесь
# структурная: каждый запрос проходит _assert_public_host() — он резолвит хост
# и проверяет КАЖДЫЙ адрес из DNS-выдачи на приватность/loopback/link-local/
# reserved, — а _NoRedirect запрещает редиректы, которыми такую проверку
# обходят. S104 тоже ложный: "0.0.0.0" встречается в файле как элемент списка
# ЗАПРЕЩЁННЫХ адресов SSRF_BLOCKED, а не как адрес привязки сокета.
"routers/webhooks_router.py" = ["S310", "S104"]
