<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Воркфлоу — CRM</title>
    <!-- Шрифты: preconnect + асинхронный CSS вместо блокирующего @import (UI FIX 2026-08-26) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
    <style>
/* CRITICAL: раскладка сайдбара до загрузки style.css.
   Значения обязаны совпадать с итоговым состоянием в style.css, иначе
   сайдбар перекрашивается на первой отрисовке. Переменные продублированы
   здесь намеренно: :root из style.css ещё не применён. */
:root { --sidebar-bg: #0f172a; --sidebar-bg-2: #020617; --primary-color: #4f46e5; }
[data-theme="dark"] { --sidebar-bg: #0b0e14; --sidebar-bg-2: #080a0f; }
.app-container { display: flex; flex-direction: row; height: 100vh; width: 100%; overflow: hidden; }
.sidebar { width: 230px; min-width: 230px; max-width: 230px; flex: 0 0 230px; background: linear-gradient(180deg, var(--sidebar-bg) 0%, var(--sidebar-bg-2) 100%); color: white; display: flex; flex-direction: column; box-shadow: 2px 0 16px rgba(16,24,40,0.12); z-index: 50; overflow-y: auto; overflow-x: hidden; }
.main-content { flex: 1 1 0%; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.sidebar-nav { flex: 1; display: flex; flex-direction: column; padding: 15px 0; }
.nav-btn { display: flex; align-items: center; gap: 12px; background: none; border: none; color: #aeb8c7; padding: 12px 14px; margin: 2px 8px; border-radius: 6px; text-align: left; font-size: 14px; cursor: pointer; white-space: nowrap; overflow: hidden; }
.nav-icon { flex-shrink: 0; width: 20px; min-width: 20px; display: flex; align-items: center; justify-content: center; }
.nav-icon svg { width: 19px; height: 19px; display: block; }
.nav-label { overflow: hidden; text-overflow: ellipsis; }
.sidebar-header { padding: 22px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
.sidebar-header h2 { font-size: 18px; background: linear-gradient(90deg, #fff, #c7d2fe); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.sidebar-footer { padding: 20px; }
.nav-btn.active { background-color: var(--primary-color); color: white; font-weight: 600; }
</style>
    <link rel="stylesheet" href="css/style.css?v=b00234887d">
    <link rel="stylesheet" href="css/liquid-glass.css?v=704369191d">
    <script src="js/boot.js?v=ab23ad71f2"></script>
    <style>
        .workflows-page { padding: 24px; max-width: 1200px; margin: 0 auto; }
        .workflows-page h1 { margin-bottom: 24px; }
        .wf-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 8px; }
        .wf-info { display: flex; flex-direction: column; gap: 4px; }
        .wf-actions { display: flex; gap: 8px; align-items: center; }
        .wf-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .wf-active { background: #d1fae5; color: #065f46; }
        .wf-inactive { background: #f3f4f6; color: #6b7280; }
        .section-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }
        .section-card h2 { font-size: 18px; margin-bottom: 16px; }
        .back-btn { margin-bottom: 16px; }
        .trigger-item, .step-item { padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .step-connector { text-align: center; padding: 8px; color: var(--text-muted); font-size: 20px; }
        .trigger-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-right: 12px; }
        .trigger-record { background: #dbeafe; }
        .trigger-schedule { background: #fef3c7; }
        .trigger-webhook { background: #e0e7ff; }
        .trigger-manual { background: #d1fae5; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 14px; background: var(--card-bg); color: var(--text-color); }
        .run-status { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .run-running { background: #fef3c7; color: #92400e; }
        .run-completed { background: #d1fae5; color: #065f46; }
        .run-failed { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="app-sidebar">
            <button class="sidebar-toggle" data-handler="toggleSidebar" title="Свернуть/развернуть меню" aria-label="Свернуть меню"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <div class="sidebar-header">
                <h2>CRM Система</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-btn" title="Канбан" aria-label="Канбан">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="11" rx="1"/></svg></span>
                    <span class="nav-label">Канбан</span>
                </a>
                <a href="/custom_objects.html" class="nav-btn" title="Объекты" aria-label="Объекты">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
                    <span class="nav-label">Объекты</span>
                </a>
                <a href="/workflows.html" class="nav-btn active" title="Воркфлоу" aria-label="Воркфлоу">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
                    <span class="nav-label">Воркфлоу</span>
                </a>
            </nav>
            <div class="sidebar-controls">
                <button id="theme-toggle" class="theme-toggle" title="Переключить тему" aria-label="Переключить тему"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg></button>
<button id="compact-toggle" class="compact-toggle" title="Плотный режим" aria-label="Плотный режим"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            </div>
            <div class="sidebar-footer">
                <a href="/admin" id="admin-link" class="admin-link-btn hidden" target="_blank" rel="noopener noreferrer" title="Админ-панель"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span><span>Админ-панель</span></a>
                <button id="logout-btn" class="logout-btn" title="Выйти"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span>Выйти</span></button>
            </div>
        </aside>

        <main class="main-content">
            <div class="workflows-page">

                <!-- Список воркфлоу -->
                <div id="wf-list">
                    <h1>Воркфлоу</h1>
                    <p class="text-muted-md" style="margin-bottom:20px;">Автоматизируйте бизнес-процессы: уведомления, создание задач, интеграции.</p>

                    <div class="section-card reveal">
                        <h2>Создать воркфлоу</h2>
                        <div class="flex-row flex-row--wrap">
                            <input type="text" id="new-wf-name" placeholder="Название (например: Уведомление о новом заказе)" class="form-input-flex form-input-flex--wide">
                            <button class="btn btn-primary" data-handler="workflowsUI.createWorkflow">Создать</button>
                        </div>
                    </div>

                    <div id="workflows-list"></div>
                </div>

                <!-- Детали воркфлоу -->
                <div id="wf-detail" class="hidden">
                    <button class="btn btn-secondary back-btn reveal" data-handler="workflowsUI.backToList">← Назад к списку</button>
                    <div class="flex-row flex-row--between flex-row--mb-lg reveal">
                        <h1 id="wf-detail-title" class="h-no-margin"></h1>
                        <div class="flex-row">
                            <button id="wf-toggle-btn" class="btn btn-success btn-sm" data-handler="workflowsUI.toggleActive">Включить</button>
                            <button class="btn btn-danger btn-sm" data-handler="workflowsUI.deleteWorkflow">Удалить</button>
                        </div>
                    </div>

                    <!-- Триггеры -->
                    <div class="section-card reveal">
                        <h2>Триггеры (Что запускает)</h2>
                        <div class="flex-row flex-row--wrap flex-row--mb">
                            <select id="new-trigger-type" class="form-input-flex">
                                <option value="record_event">Изменение записи</option>
                                <option value="manual">Ручной запуск</option>
                                <option value="schedule">По расписанию</option>
                                <option value="webhook">Webhook</option>
                            </select>
                            <select id="new-trigger-object" class="form-input-flex">
                                <option value="card">Сделка</option>
                                <option value="client">Клиент</option>
                                <option value="payment">Оплата</option>
                            </select>
                            <select id="new-trigger-event" class="form-input-flex">
                                <option value="created">Создана</option>
                                <option value="updated">Обновлена</option>
                                <option value="deleted">Удалена</option>
                            </select>
                            <button class="btn btn-primary btn-sm" data-handler="workflowsUI.createTrigger">Добавить</button>
                        </div>
                        <div id="triggers-list"></div>
                    </div>

                    <!-- Шаги -->
                    <div class="section-card reveal" style="--d:80ms">
                        <h2>Шаги (Что происходит)</h2>
                        <div class="flex-row flex-row--wrap flex-row--mb">
                            <select id="new-step-type" class="form-input-flex">
                                <option value="action">Действие</option>
                                <option value="condition">Условие</option>
                                <option value="delay">Задержка</option>
                            </select>
                            <select id="new-step-action" class="form-input-flex">
                                <option value="create_record">Создать запись</option>
                                <option value="update_record">Обновить запись</option>
                                <option value="send_email">Отправить email</option>
                                <option value="http_request">HTTP-запрос</option>
                            </select>
                            <input type="text" id="new-step-config" placeholder="Параметры (JSON)" class="form-input-flex">
                            <button class="btn btn-primary btn-sm" data-handler="workflowsUI.createStep">Добавить</button>
                        </div>
                        <div id="steps-list"></div>
                    </div>

                    <!-- Логи -->
                    <div class="section-card reveal" style="--d:120ms">
                        <h2>Последние запуски</h2>
                        <div id="runs-list"></div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="js/api.js?v=0eea5fdde0"></script>
    <script src="js/features.js?v=3b6db604ef"></script>
    <script defer src="js/reveal.js?v=559fd1b3f1"></script>
    <script src="js/workflows_page.js?v=9ea1d8e149"></script>
    <script defer src="js/ui-polish.js?v=7b803c455b"></script>
    <script defer src="js/handlers.js?v=094c93cb27"></script>
</body>
</html>
