<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки — CRM</title>
    <!-- Шрифты: preconnect + асинхронный CSS вместо блокирующего @import (UI FIX 2026-08-26) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
    <style>
/* CRITICAL: раскладка сайдбара до загрузки style.css.
   Значения обязаны совпадать с итоговым состоянием в style.css, иначе
   сайдбар перекрашивается на первой отрисовке. Переменные продублированы
   здесь намеренно: :root из style.css ещё не применён. */
:root { --sidebar-bg: #0f172a; --sidebar-bg-2: #020617; --primary-color: #4f46e5; }
[data-theme="dark"] { --sidebar-bg: #0b0e14; --sidebar-bg-2: #080a0f; }
.app-container { display: flex; flex-direction: row; height: 100vh; width: 100%; overflow: hidden; }
.sidebar { width: 230px; min-width: 230px; max-width: 230px; flex: 0 0 230px; background: linear-gradient(180deg, var(--sidebar-bg) 0%, var(--sidebar-bg-2) 100%); color: white; display: flex; flex-direction: column; box-shadow: 2px 0 16px rgba(16,24,40,0.12); z-index: 50; overflow-y: auto; overflow-x: hidden; }
.main-content { flex: 1 1 0%; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.sidebar-nav { flex: 1; display: flex; flex-direction: column; padding: 15px 0; }
.nav-btn { display: flex; align-items: center; gap: 12px; background: none; border: none; color: #aeb8c7; padding: 12px 14px; margin: 2px 8px; border-radius: 6px; text-align: left; font-size: 14px; cursor: pointer; white-space: nowrap; overflow: hidden; }
.nav-icon { flex-shrink: 0; width: 20px; min-width: 20px; display: flex; align-items: center; justify-content: center; }
.nav-icon svg { width: 19px; height: 19px; display: block; }
.nav-label { overflow: hidden; text-overflow: ellipsis; }
.sidebar-header { padding: 22px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
.sidebar-header h2 { font-size: 18px; background: linear-gradient(90deg, #fff, #c7d2fe); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.sidebar-footer { padding: 20px; }
.nav-btn.active { background-color: var(--primary-color); color: white; font-weight: 600; }
</style>
    <link rel="stylesheet" href="css/style.css?v=b00234887d">
    <link rel="stylesheet" href="css/liquid-glass.css?v=704369191d">
    <script src="js/boot.js?v=ab23ad71f2"></script>
    <style>
        .settings-page { padding: 24px; max-width: 1200px; margin: 0 auto; }
        .settings-page h1 { margin-bottom: 24px; }
        .settings-tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 0; }
        .settings-tab { padding: 10px 20px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); font-size: 14px; font-weight: 500; cursor: pointer; transition: var(--transition-fast); margin-bottom: -1px; }
        .settings-tab:hover { color: var(--text-color); }
        .settings-tab.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .settings-content { min-height: 400px; }
        .settings-pane { display: none; }
        .settings-pane.active { display: block; }
        .section-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }
        .section-card h2 { font-size: 18px; margin-bottom: 16px; }
        .form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 14px; background: var(--card-bg); color: var(--text-color); }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 8px; }
        .list-item-info { display: flex; flex-direction: column; gap: 2px; }
        .list-item-actions { display: flex; gap: 8px; }
        .back-btn { margin-bottom: 16px; }
        .step-connector { text-align: center; padding: 8px; color: var(--text-muted); font-size: 20px; }
        .trigger-icon { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; margin-right: 8px; }
        .trigger-record { background: #dbeafe; }
        .trigger-schedule { background: #fef3c7; }
        .trigger-webhook { background: #e0e7ff; }
        .trigger-manual { background: #d1fae5; }
        .wf-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .wf-active { background: #d1fae5; color: #065f46; }
        .wf-inactive { background: #f3f4f6; color: #6b7280; }
        .wf-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="app-sidebar">

            <div class="sidebar-header">
                <h2>CRM Система</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-btn" title="Канбан-доска" aria-label="Канбан-доска">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="11" rx="1"/></svg></span>
                    <span class="nav-label">Канбан-доска</span>
                </a>
                <a href="/#payments" class="nav-btn" title="Реестр оплат" aria-label="Реестр оплат">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></span>
                    <span class="nav-label">Реестр оплат</span>
                </a>
                <a href="/#writeoffs" class="nav-btn" title="Списание" aria-label="Списание">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span>
                    <span class="nav-label">Списание</span>
                </a>
                <a href="/#documents" class="nav-btn" title="Документы" aria-label="Документы">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
                    <span class="nav-label">Документы</span>
                </a>
                <a href="/#clients" class="nav-btn" title="Клиенты" aria-label="Клиенты">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
                    <span class="nav-label">Клиенты</span>
                </a>
                <a href="/#suppliers" class="nav-btn" title="Поставщики" aria-label="Поставщики">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span>
                    <span class="nav-label">Поставщики</span>
                </a>
                <a href="/#dashboard" class="nav-btn" title="Дашборд" aria-label="Дашборд">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg></span>
                    <span class="nav-label">Дашборд</span>
                </a>
                <a href="/#calendar" class="nav-btn" title="Календарь" aria-label="Календарь">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
                    <span class="nav-label">Календарь</span>
                </a>
                <a href="/settings.html" class="nav-btn active" title="Настройки" aria-label="Настройки">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
                    <span class="nav-label">Настройки</span>
                </a>
            </nav>
            <div class="sidebar-controls">
                <button id="theme-toggle" class="theme-toggle" title="Переключить тему" aria-label="Переключить тему"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg></button>
<button id="compact-toggle" class="compact-toggle" title="Плотный режим" aria-label="Плотный режим"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            </div>
            <div class="sidebar-footer">
                <a href="/admin" id="admin-link" class="admin-link-btn hidden" target="_blank" rel="noopener noreferrer" title="Админ-панель"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span><span>Админ-панель</span></a>
                <button id="logout-btn" class="logout-btn" title="Выйти"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span>Выйти</span></button>
            </div>
        </aside>

        <main class="main-content">
            <div class="settings-page">
                <h1>Настройки</h1>

                <div class="settings-tabs">
                    <button class="settings-tab active" data-tab="objects">Кастомные объекты</button>
                    <button class="settings-tab" data-tab="workflows">Воркфлоу</button>
                    <button class="settings-tab" data-tab="email">Почта</button>
                </div>

                <div class="settings-content">

                    <!-- === КАСТОМНЫЕ ОБЪЕКТЫ === -->
                    <div id="tab-objects" class="settings-pane active">
                        <div id="obj-list-view" class="reveal">
                            <div class="section-card">
                                <h2>Создать объект</h2>
                                <div class="form-row">
                                    <input type="text" id="obj-label" placeholder="Название (Товар)" class="form-input-flex">
                                    <input type="text" id="obj-name" placeholder="Имя (product)" class="form-input-flex">
                                    <button class="btn btn-primary" data-handler="ObjAPI.create">Создать</button>
                                </div>
                            </div>
                            <div id="objects-container"></div>
                        </div>

                        <div id="obj-detail-view" class="hidden">
                            <button class="btn btn-secondary back-btn reveal" data-handler="ObjAPI.backToList">← Назад</button>
                            <h2 id="obj-detail-title" class="reveal"></h2>
                            <div class="section-card reveal">
                                <h3>Поля</h3>
                                <div class="form-row">
                                    <input type="text" id="field-label" placeholder="Название поля" class="form-input-flex form-input-flex--narrow">
                                    <input type="text" id="field-name" placeholder="Имя (латиницей)" class="form-input-flex form-input-flex--narrow">
                                    <select id="field-type" class="form-input-flex">
                                        <option value="text">Текст</option>
                                        <option value="number">Число</option>
                                        <option value="select">Выбор</option>
                                        <option value="date">Дата</option>
                                        <option value="currency">Валюта</option>
                                        <option value="boolean">Да/Нет</option>
                                    </select>
                                    <button class="btn btn-primary" data-handler="ObjAPI.addField">Добавить</button>
                                </div>
                                <div id="fields-container"></div>
                            </div>
                            <div class="section-card">
                                <div class="flex-row flex-row--between flex-row--mb">
                                    <h3 class="h-no-margin">Записи</h3>
                                    <button class="btn btn-primary btn-sm" data-handler="ObjAPI.showNewRecord">+ Новая запись</button>
                                </div>
                                <div id="new-record-form" class="hidden" class="bg-subtle"></div>
                                <div id="records-container"></div>
                            </div>
                        </div>
                    </div>

                    <!-- === ВОРКФЛОУ === -->
                    <div id="tab-workflows" class="settings-pane">
                        <div id="wf-list-view" class="reveal">
                            <div class="section-card">
                                <h2>Создать воркфлоу</h2>
                                <div class="form-row">
                                    <input type="text" id="wf-name" placeholder="Название (Уведомление о заказе)" class="form-input-flex form-input-flex--wide">
                                    <button class="btn btn-primary" data-handler="WfAPI.create">Создать</button>
                                </div>
                            </div>
                            <div id="workflows-container"></div>
                        </div>

                        <div id="wf-detail-view" class="hidden">
                            <button class="btn btn-secondary back-btn reveal" data-handler="WfAPI.backToList">← Назад</button>
                            <div class="flex-row flex-row--between flex-row--mb-lg reveal">
                                <h2 id="wf-detail-title" class="h-no-margin"></h2>
                                <div class="flex-row">
                                    <button id="wf-toggle-btn" class="btn btn-success btn-sm" data-handler="WfAPI.toggleActive">Включить</button>
                                    <button class="btn btn-danger btn-sm" data-handler="WfAPI.deleteWf">Удалить</button>
                                </div>
                            </div>
                            <div class="section-card reveal">
                                <h3>Триггеры</h3>
                                <div class="form-row">
                                    <select id="tr-type" class="form-input-flex">
                                        <option value="record_event">Изменение записи</option>
                                        <option value="manual">Ручной запуск</option>
                                        <option value="schedule">По расписанию</option>
                                        <option value="webhook">Webhook</option>
                                    </select>
                                    <select id="tr-object" class="form-input-flex">
                                        <option value="card">Сделка</option><option value="client">Клиент</option><option value="payment">Оплата</option>
                                    </select>
                                    <select id="tr-event" class="form-input-flex">
                                        <option value="created">Создана</option><option value="updated">Обновлена</option><option value="deleted">Удалена</option>
                                    </select>
                                    <button class="btn btn-primary btn-sm" data-handler="WfAPI.addTrigger">Добавить</button>
                                </div>
                                <div id="triggers-container"></div>
                            </div>
                            <div class="section-card reveal" style="--d:80ms">
                                <h3>Шаги</h3>
                                <div class="form-row">
                                    <select id="st-type" class="form-input-flex">
                                        <option value="action">Действие</option><option value="condition">Условие</option><option value="delay">Задержка</option>
                                    </select>
                                    <select id="st-action" class="form-input-flex">
                                        <option value="create_record">Создать запись</option><option value="update_record">Обновить запись</option>
                                        <option value="send_email">Отправить email</option><option value="http_request">HTTP-запрос</option>
                                    </select>
                                    <input type="text" id="st-config" placeholder="Параметры (JSON)" class="form-input-flex">
                                    <button class="btn btn-primary btn-sm" data-handler="WfAPI.addStep">Добавить</button>
                                </div>
                                <div id="steps-container"></div>
                            </div>
                            <div class="section-card reveal" style="--d:120ms">
                                <h3>Последние запуски</h3>
                                <div id="runs-container"></div>
                            </div>
                        </div>
                    </div>

                    <!-- === ПОЧТА === -->
                    <div id="tab-email" class="settings-pane">
                        <div class="section-card reveal">
                            <h2>Настройки IMAP</h2>
                            <div class="form-group">
                                <label>IMAP-сервер</label>
                                <input type="text" id="email-imap" placeholder="imap.yandex.ru">
                            </div>
                            <div class="form-group">
                                <label>Электронная почта</label>
                                <input type="email" id="email-user" placeholder="email@yandex.ru">
                            </div>
                            <div class="form-group">
                                <label>Пароль приложения</label>
                                <input type="password" id="email-pass" placeholder="Пароль приложения">
                            </div>
                            <div class="form-group">
                                <label>Колонка для новых лидов</label>
                                <select id="email-target">
                                    <option value="Новый запрос">Новый запрос</option>
                                    <option value="В работе">В работе</option>
                                    <option value="Ждет оплаты">Ждет оплаты</option>
                                    <option value="Сборка">Сборка</option>
                                </select>
                            </div>
                            <button class="btn btn-primary" data-handler="EmailAPI.save">Сохранить настройки</button>
                        </div>
                        <div class="section-card reveal" style="--d:80ms">
                            <h2>Синхронизация</h2>
                            <div id="email-status"><p>Статус: <span id="email-status-text">—</span></p></div>
                            <button class="btn btn-primary" data-handler="EmailAPI.sync" style="margin-top:12px">Проверить почту и импортировать</button>
                            <div id="email-results" style="margin-top:16px;"></div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js?v=0eea5fdde0"></script>
    <script src="js/features.js?v=3b6db604ef"></script>
    <script defer src="js/reveal.js?v=559fd1b3f1"></script>
    <script src="js/settings_page.js?v=61998eba6c"></script>
    <script defer src="js/ui-polish.js?v=7b803c455b"></script>
    <script defer src="js/handlers.js?v=094c93cb27"></script>
</body>
</html>
