# Production config: HTTPS with an HTTP redirect.
#
# Enable by mounting this file instead of the default:
#   volumes:
#     - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
#     - ./nginx/snippets:/etc/nginx/snippets:ro
#     - ./nginx/snippets/hsts-map.conf:/etc/nginx/conf.d/00-hsts-map.conf:ro
#     - ./ssl:/etc/nginx/ssl:ro
#
# Requires ssl/cert.pem and ssl/key.pem. Get them with:
#   bash scripts/setup_ssl.sh your-domain.com        (Let's Encrypt)
#   bash scripts/setup_ssl.sh --self-signed          (local testing)
#
# Replace server_name with the real domain before deploying.

# HTTP: serve the ACME challenge, redirect everything else to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt renewal must stay reachable over plain HTTP,
    # so this location is matched before the redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Внутренний process probe nginx не перенаправляет на TLS. Публичные
    # /health* на HTTP переходят в catch-all redirect, а на HTTPS проксируются
    # backend и не возвращают статический 200 при его недоступности.
    location = /_nginx_live {
        access_log off;
        default_type text/plain;
        return 200 "nginx alive\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 50M;

    # Н22 (аудит 06.09): без сжатия CSS ~250КБ и JSON-ответы уходили как есть.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Modern, still broadly compatible.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS is applied by the shared snippet via $hsts_value, which is non-empty
    # only for https. Setting it here too would emit the header twice.
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/app-locations.conf;
}
