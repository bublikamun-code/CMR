# Location'ы двух фронтов: v2 (основной, /v2) и legacy (заморожен, /legacy).
#
# ⚠️ ЭТО РЕКОНСТРУКЦИЯ, А НЕ БОЕВОЙ КОНФИГ — ТРЕБУЕТ СВЕРКИ С БОЕВЫМ НА СЕРВЕРЕ.
# Боевого nginx-конфига в репозитории нет вовсе, а снять его по SSH нельзя,
# поэтому файл выведен из того, что в репо есть:
#   nginx/snippets/app-locations.conf  — стиль, проксирование API, заголовки;
#   Dockerfile.frontend                — в образ фронта копируется ТОЛЬКО site/;
#   Dockerfile.backend                 — COPY server_snapshot/ . → site-v2 в образе есть;
#   tools/deploy.sh (front|v2)         — site/ → $REMOTE_DIR/, site-v2/ → $REMOTE_DIR/site-v2/;
#   server_snapshot/main.py            — маунт /v2, роуты /, /legacy, /legacy/admin,
#                                        кэш-политика V2_IMMUTABLE_PREFIXES и CSP.
# Синтаксис НЕ проверен `nginx -t` (на машине разработки nginx не установлен,
# контейнеры не поднимались). Перед включением сверить с боевым: webroot, адрес
# апстрима PM2, путь include'ов и то, не отдаёт ли боевой nginx /v2 статикой.
#
# ЗАЧЕМ ЭТО НУЖНО. В app-locations.conf есть только `location /` с
# `try_files $uri $uri/ /index.html`, поэтому /v2/ не находит файла и молча
# отдаёт LEGACY index.html: в docker-образ фронта site-v2 не копируется вовсе
# (Dockerfile.frontend: `COPY site/ /usr/share/nginx/html/`), а на голом железе
# каталог лежит как $REMOTE_DIR/site-v2 — то есть НЕ по URL-пути /v2. Основной
# фронт при этом живёт на /v2, и расхождение не было видно ни одному гейту.
#
# КАК ВКЛЮЧИТЬ. Добавить одну строку в server-блок ПОСЛЕ include app-locations.conf:
#   include /etc/nginx/snippets/v2-legacy-locations.conf;
# Порядок include не важен: `=` и `^~` ниже выигрывают у `location /` и у
# regex'ов API при любом порядке. В docker-путь файл уже попадает
# (Dockerfile.frontend: `COPY nginx/snippets/ /etc/nginx/snippets/`), но сам
# include придётся добавить в nginx/http.conf и nginx/https.conf — эти файлы
# здесь осознанно не правятся. На голом железе путь include может отличаться.
#
# ПОЧЕМУ ПРОКСИРУЕМ, А НЕ ОТДАЁМ СТАТИКОЙ. Маршрутизация фронтов — решение
# приложения: main.py переключает `/` между v2 и legacy по CRM_FRONTEND
# (документированный откат — CRM_FRONTEND=legacy в .pm2.env + рестарт PM2), оно
# же ставит CSP и кэш-заголовки. Отдавая /v2 статикой, nginx завёл бы вторую
# копию этой политики и начал с ней разъезжаться. Цена — ~500 КБ css/js идут
# через uvicorn, поэтому ниже явно включено сжатие (gzip_proxied).
# Замерено через TestClient на main.py: /v2/ → 200 no-cache;
# /v2/css|js|fonts → 200 public, max-age=31536000, immutable; /v2 → 307 /v2/.
#
# Опциональный быстрый путь (здесь НЕ включён): отдавать штампованные ассеты
# nginx'ом — location ^~ /v2/css/ { alias <webroot>/site-v2/css/; expires 1y; }
# и то же для js/ и fonts/. В docker-пути для этого сначала нужно научить
# Dockerfile.frontend копировать server_snapshot/site-v2/.
#
# Три proxy-блока ниже намеренно дублируют настройки вместо общих директив на
# уровне server: gzip_types и proxy_set_header, объявленные в server-контексте,
# конфликтуют с такими же директивами в nginx/http.conf и nginx/https.conf,
# а проверить это `nginx -t` здесь нечем. Location-контекст изолирован и
# безопасен, плата — повторяющийся текст.

# /v2 без завершающего слэша обязан стать /v2/. Ассеты v2 подключены
# ОТНОСИТЕЛЬНЫМИ путями (site-v2/index.html: href="css/...";
# css/shell-v2-base.css: url(../fonts/...)), поэтому резолвятся от URL страницы:
# на /v2/ это /v2/css/... и /v2/fonts/..., а на /v2 — /css/..., то есть CSS и
# шрифты ЗАМОРОЖЕННОГО legacy. Само приложение на /v2 отвечает 307 → /v2/, но
# до него дело не дойдёт: /v2 не совпадает с префиксом `/v2/` и проваливается в
# `location /`, который отдаст legacy index.html вместо редиректа.
# Точное совпадение `=` обрабатывает запрос раньше любых префиксных правил.
# 301, а не 307: редирект не зависит от CRM_FRONTEND, кэшировать его безопасно.
location = /v2 {
    return 301 /v2/;
}

# Весь v2: HTML (/v2/, /v2/index.html) и штампованные ассеты (/v2/css|js|fonts).
# `^~` отключает поиск regex-location'ов, поэтому вложенный в `location /` блок
# `~ \.html$` не подменит кэш-политику v2: он ставит "no-cache, must-revalidate",
# а main.py для HTML v2 отдаёт ровно "no-cache". `expires` здесь не используется
# намеренно — иначе nginx добавил бы ВТОРОЙ Cache-Control к заголовку приложения.
location ^~ /v2/ {
    # Docker: embedded DNS. Резолвинг через переменную откладывается до запроса,
    # поэтому `nginx -t` проходит на стадии сборки образа, когда сети compose ещё
    # нет, а пересоздание контейнера backend не оставляет протухший IP (502).
    # ГОЛОЕ ЖЕЛЕЗО (прод, PM2): заменить на set $crm_backend "http://127.0.0.1:8000";
    # и убрать resolver — порт и адрес сверить с боевым конфигом.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $crm_backend "http://backend:8000";
    # $request_uri обязателен: с переменной в proxy_pass nginx не подставляет
    # совпавший URI сам. Заодно сохраняется query string, а в нём штампы ?v= —
    # без них кэш-бастинг v2 не работает.
    proxy_pass $crm_backend$request_uri;

    # Приложение ответы не жмёт (в main.py нет GZipMiddleware), а gzip_proxied
    # по умолчанию off — без этой строки nginx отдал бы ~500 КБ css/js как есть.
    # Н22 (аудит 06.09) добавлял сжатие ровно из-за этого. gzip_types в location
    # ЗАМЕЩАЕТ унаследованный список, поэтому он повторён целиком и дополнен
    # text/javascript: Python 3.11+ определяет .js как text/javascript (замерено:
    # /v2/js/v2/boot.js отдаётся с Content-Type text/javascript), а в
    # nginx/http.conf и nginx/https.conf указан только application/javascript.
    # text/html жмётся всегда. font/woff2 не добавлен — woff2 уже сжат.
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    # Эти два заголовка nginx ставит сам (snippets/security-headers.conf),
    # поэтому копии приложения снимаются: заголовок должен встречаться один раз.
    # CSP, Cache-Control, Referrer-Policy и Permissions-Policy НЕ скрываются —
    # их единственный источник main.py.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    include /etc/nginx/snippets/security-headers.conf;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Говорит приложению, был ли исходный запрос http или https.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Замороженный legacy-фронт. Точное совпадение для /legacy (роут main.py
# serve_legacy_frontend) и префикс для вложенных путей — в первую очередь
# /legacy/admin (роут serve_legacy_admin). Два блока вместо одного `^~ /legacy`,
# чтобы префикс не перехватывал посторонние /legacy*: префиксное правило
# совпадает по началу строки, а не по сегменту пути.
location = /legacy {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $crm_backend "http://backend:8000";
    proxy_pass $crm_backend$request_uri;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}

location ^~ /legacy/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $crm_backend "http://backend:8000";
    proxy_pass $crm_backend$request_uri;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}

# ИЗВЕСТНЫЙ ПРОБЕЛ, который этот файл ОСОЗНАННО не закрывает (вне задачи: нужны
# только location'ы /v2 и /legacy). Замерено на main.py: `/` → 302 /v2/,
# `/admin` → 302 /v2/. Но в топологии «nginx отдаёт статику» оба запроса
# перехватывает `location /` с try_files и отдаёт legacy index.html, до
# приложения они не доходят. То есть переключение фронта и документированный
# откат CRM_FRONTEND=legacy в этой топологии не работают для `/` и `/admin`.
# Чинить надо отдельно и только сверившись с боевым конфигом: либо проксировать
# `/` и `/admin` в приложение, либо повторить редирект в nginx — второй вариант
# сломает откат по CRM_FRONTEND, поэтому решение за владельцем.
