# Shared location blocks for the CRM frontend.
#
# Included by BOTH the HTTP and the HTTPS server blocks so the two can never
# drift apart. The previous config had the HTTPS block commented out with its own
# copy of the rules, and that copy still proxied the non-existent /api/ prefix -
# enabling TLS would silently have reintroduced the "API returns HTML" bug.
#
# Included from /etc/nginx/snippets/app-locations.conf

# Frontend - static files
#
# IMPORTANT: nginx's add_header is not additive across levels - as soon as a
# location declares its own add_header, it DROPS every header inherited from the
# parent. The nested blocks below therefore re-include the security headers.
# Without that, `/` (internally redirected to /index.html, which re-matches the
# \.html$ block) was served with no X-Frame-Options at all.
location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Cache-busting for assets with ?v= hash
    location ~ ^/(css|js)/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # HTML must not be cached: it carries the asset hashes above.
    location ~ \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}

# Proxy API requests to the backend.
# The frontend calls the API at the root (site/js/api.js: API_BASE_URL = ''),
# so these are the real router prefixes from server_snapshot/routers/*.py.
# A regex location is evaluated before the prefix location "/", so these win
# over the static try_files rule above.
location ~ ^/(auth|kanban|clients|suppliers|tags|payments|writeoffs|activity|tasks|notifications|custom|email-parser|workflows|webhooks|views|cards|checklists|attachments|files|docs|redoc|openapi\.json|api|health)(/|$) {
    # Docker's embedded DNS. Resolving through a variable defers the lookup to
    # request time, which fixes two things:
    #   1. a static upstream is resolved once at startup, so nginx kept sending
    #      traffic to a stale IP (502) after the backend container was recreated;
    #   2. `nginx -t` no longer fails at image build time, where the compose
    #      network does not exist yet.
    # $request_uri is required here: with a variable in proxy_pass nginx does not
    # append the matched URI automatically. It carries the query string too.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $crm_backend "http://backend:8000";
    proxy_pass $crm_backend$request_uri;

    # The FastAPI middleware sets these too. Drop the upstream copies so each
    # header appears exactly once, with nginx as the single source of truth.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # X-Forwarded-For заменяется: значение от клиента нельзя принимать,
    # иначе rate-limit доверял бы подделанному адресу.
    proxy_set_header X-Forwarded-For $remote_addr;
    # Tells FastAPI whether the original request was http or https.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # Timeouts for long-running requests
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Внутренний liveness nginx для HEALTHCHECK. /health, /health/live и
# /health/ready проксируются backend выше: статический 200 не должен скрывать
# упавший API или его неготовые зависимости.
location = /_nginx_live {
    access_log off;
    default_type text/plain;
    return 200 "nginx alive\n";
}
