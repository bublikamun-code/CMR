# Maps the request scheme to an HSTS header value.
#
# Lives in the http context (loaded via conf.d/*.conf, before the server blocks),
# because `map` is not allowed inside a server block.
#
# nginx skips add_header entirely when the value is an empty string, so plain
# HTTP responses carry no HSTS header - which is what the spec requires, and it
# lets the HTTP and HTTPS server blocks share one security-headers snippet.
#
# $scheme is used rather than $http_x_forwarded_proto: this nginx terminates TLS
# itself. Behind an upstream load balancer, switch to the forwarded header.
map $scheme $hsts_value {
    default "";
    https   "max-age=31536000; includeSubDomains";
}
