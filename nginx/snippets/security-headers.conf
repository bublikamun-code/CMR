# Shared security headers.
#
# Two nginx quirks drive the shape of this file:
#
# 1. `always` is required, otherwise nginx omits the header on error responses
#    (4xx/5xx) - exactly where clickjacking and sniffing protections still apply.
#
# 2. add_header is NOT additive across levels: a location that declares its own
#    add_header drops every header inherited from the parent. That is why this
#    snippet is re-included inside the nested locations rather than being set
#    once at server level.
#
# Included from /etc/nginx/snippets/security-headers.conf

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# HSTS, but only when the request actually arrived over TLS. $hsts_value is
# defined in the http context (see nginx/snippets/hsts-map.conf) and is empty on
# plain HTTP; nginx skips add_header when the value is empty, so this same
# snippet is safe to include from the HTTP server block.
#
# `preload` is deliberately omitted: it is a one-way door - browsers refuse
# plain HTTP for the domain for months, and removal is slow. Add it only once
# TLS is proven stable.
add_header Strict-Transport-Security $hsts_value always;
