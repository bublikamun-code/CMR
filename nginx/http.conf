# Default config: plain HTTP. Used for local development.
#
# For TLS, switch the mounted config to nginx/https.conf - see
# docs/deployment/DEPLOYMENT.md. Both files include the same shared snippets, so
# the location rules cannot drift apart.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 50M;

    # Н22 (аудит 06.09): без сжатия CSS ~250КБ и JSON-ответы уходили как есть.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/app-locations.conf;
}
