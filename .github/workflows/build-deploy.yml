name: Build & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    runs-on: ubuntu-latest
    # NOTE: no `services:` block here. It previously pulled the backend image by
    # ${{ github.sha }}, but that tag is only pushed on main, so the job failed on
    # every PR and on develop. Tests run against the source tree instead.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # site-v2 — генерируемый каталог, но в git он лежит обычными файлами.
      # Гейт собирает эталон из tools/mockups во временный каталог и сверяет его
      # с артефактом, рабочее дерево не меняется. Без него правка источников
      # без пересборки уезжает в main молча: tools/deploy.sh v2 пересобирает
      # артефакт на месте, а docker-образ бэкенда (COPY server_snapshot/ .)
      # печёт то, что лежит в git. Ставится ДО установки зависимостей — нужны
      # только stdlib и python3, а падать лучше за секунды, а не после pip.
      # Провал здесь блокирует deploy-production через needs: [build, test, ...].
      - name: Verify site-v2 is up to date with its sources
        run: python3 server_snapshot/tools/check_site_v2_fresh.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server_snapshot/requirements.txt
          pip install pytest httpx

      # Н2 (аудит 06.09): реальный pytest вместо smoke-импорта test_routes.py.
      # Тесты поднимают приложение с временной CRM_DATA_DIR (tests/conftest.py)
      # и не требуют внешних сервисов.
      - name: Run tests
        working-directory: server_snapshot
        run: python -m pytest tests/ -v

      - name: Verify no secrets or databases leak into the backend image
        run: |
          docker build -f Dockerfile.backend -t crm-backend:ci .
          for f in /app/crm_app.db /app/.secret_key /app/.cron_token \
                   /app/routers/.secret_key /app/email_settings.json; do
            if docker run --rm crm-backend:ci test -e "$f"; then
              echo "::error::$f must not be baked into the image"
              exit 1
            fi
          done
          echo "No secrets or databases found in the image."

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'crm-backend:ci'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2

      - name: SAST scan with Bandit
        uses: gaurav-nelson/github-action-bandit@v1
        with:
          path: "server_snapshot"

  deploy-staging:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    # NOTE: Staging is not yet provisioned. This job is a placeholder that
    # documents the intended flow — replace CRM_STAGING_* secrets when the
    # staging server exists. It does not fail the pipeline.
    steps:
      - name: Staging not provisioned
        run: |
          echo "::notice::Staging deployment skipped — no staging server yet."
          echo "To enable: set CRM_STAGING_SSH_KEY, CRM_STAGING_HOST, CRM_STAGING_USER secrets."
          echo "Then replace this step with: tools/deploy.sh front && tools/deploy.sh back ..."

  deploy-production:
    needs: [build, test, security-audit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Deploys to the live bare-metal server (hoster.by) over SSH+rsync.
    # The server runs PM2, not Docker — see docs/deployment/DEPLOYMENT.md.
    # Required GitHub secrets:
    #   CRM_DEPLOY_KEY  — private SSH key (matches ~/.ssh/crm_svetvdome_deploy)
    #   CRM_DEPLOY_HOST — server IP (87.232.64.12)
    #   CRM_DEPLOY_USER — SSH user (h212005)
    # If any secret is missing, the job exits gracefully with a notice
    # rather than failing the pipeline.
    env:
      # Resolved once at job level so step-level `if:` can read it.
      HAS_SECRETS: ${{ secrets.CRM_DEPLOY_KEY != '' && secrets.CRM_DEPLOY_HOST != '' && secrets.CRM_DEPLOY_USER != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ssh key
        if: ${{ env.HAS_SECRETS == 'true' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CRM_DEPLOY_KEY }}" > ~/.ssh/crm_svetvdome_deploy
          chmod 600 ~/.ssh/crm_svetvdome_deploy
          ssh-keyscan -H ${{ secrets.CRM_DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Backup database on server
        if: ${{ env.HAS_SECRETS == 'true' }}
        # ВАЖНО: бэкап ВНЕ веб-корна (фидбек безопасности 07.09). Раньше
        # копия базы писалась в webroot/backups и становилась потенциально
        # скачиваемой при любой смене конфига nginx. Снимок делается через
        # sqlite3 .backup (консистентный на живой базе с WAL), права 600.
        run: |
          ssh -i ~/.ssh/crm_svetvdome_deploy \
            ${{ secrets.CRM_DEPLOY_USER }}@${{ secrets.CRM_DEPLOY_HOST }} \
            'D=/var/www/h212005/data; P=$D/backups_predeploy; \
             mkdir -p "$P" && chmod 700 "$P"; \
             TS=$(date +%Y%m%d_%H%M%S); \
             python3 -c "import sqlite3; sqlite3.connect(\"$D/crm_data/crm_app.db\").backup(sqlite3.connect(\"$P/crm_app.db.$TS\"))" && chmod 600 "$P/crm_app.db.$TS"; \
             ls -t "$P"/crm_app.db.* | tail -n +6 | xargs -r rm -f'

      - name: Deploy frontend
        if: ${{ env.HAS_SECRETS == 'true' }}
        env:
          SSH_KEY: ~/.ssh/crm_svetvdome_deploy
          SSH_USER: ${{ secrets.CRM_DEPLOY_USER }}
          SSH_HOST: ${{ secrets.CRM_DEPLOY_HOST }}
        run: bash tools/deploy.sh front

      # Решение владельца 23.09: автодеплой v2 из CI НЕ включать — выкатка
      # основного фронта остаётся ручным действием (tools/deploy.sh v2), как и
      # предусмотрено AGENTS.md («деплой — по договорённости с владельцем, не
      # автоматом»). Гейт свежести site-v2 в job `test` оставлен: он ничего не
      # деплоит и не даёт разъехаться mockups и артефакту в git.

      - name: Skip deploy (no secrets configured)
        if: ${{ env.HAS_SECRETS != 'true' }}
        run: |
          echo "::notice::Production deploy skipped — CRM_DEPLOY_KEY/CRM_DEPLOY_HOST/CRM_DEPLOY_USER secrets not set."
          echo "To enable: add these secrets to the repository settings, then push to main again."
