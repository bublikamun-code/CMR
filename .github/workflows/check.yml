name: check

# CI-гейты Фазы 4: красный прогон блокирует merge в main.
# Состав гейта — scripts/check.sh (7 шагов): import main → pytest ×2
# профиля схемы → stamp_assets --check → свежесть Vite-бандла → ruff →
# чистый venv + bcrypt. Бандл собирается в гейте — node нужен в CI.

on:
  push:
    branches: [main, "fix/**", "test/**", "refactor/**", "feat/**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Шаг 5/7 гейта собирает Vite-бандл (npm ci → vite build).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Зависимости проекта (.venv)
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt

      # check.sh обращается к .venv/bin/python — в CI venv создаётся
      # с тем же именем, скрипт работает без изменений.
      - name: Гейты
        run: bash scripts/check.sh
