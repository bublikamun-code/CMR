[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers

# Профиль схемы БД задаётся переменной окружения CRM_TEST_SCHEMA:
#   prod   (по умолчанию) — фактический DDL боевой базы из tests/fixtures/prod_schema.sql
#   models — только Base.metadata.create_all() по models.py
# Прогон обоих профилей:
#   .venv/bin/python -m pytest
#   CRM_TEST_SCHEMA=models .venv/bin/python -m pytest

markers =
    money: инварианты денежных расчётов (приоритет A)
    integrity: связи между таблицами, каскады, целостность (приоритет D)
    schema_parity: паритет моделей и Pydantic-схем (приоритет E)
    access: границы доступа и роли (приоритет F)
    known_bug: тест, который фиксирует ЖИВОЙ дефект и сейчас падает

filterwarnings =
    ignore::DeprecationWarning:passlib.utils.*
    ignore::PendingDeprecationWarning:starlette.formparsers.*
    ignore::DeprecationWarning:starlette.testclient.*
