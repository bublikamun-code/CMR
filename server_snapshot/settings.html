<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки — CRM</title>
    <link rel="stylesheet" href="css/style.css?v=30">
    <style>
        .settings-page { padding: 24px; max-width: 1200px; margin: 0 auto; }
        .settings-page h1 { margin-bottom: 24px; }
        .settings-tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 0; }
        .settings-tab { padding: 10px 20px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); font-size: 14px; font-weight: 500; cursor: pointer; transition: var(--transition-fast); margin-bottom: -1px; }
        .settings-tab:hover { color: var(--text-color); }
        .settings-tab.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .settings-content { min-height: 400px; }
        .settings-pane { display: none; }
        .settings-pane.active { display: block; }
        .section-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }
        .section-card h2 { font-size: 18px; margin-bottom: 16px; }
        .form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 14px; background: var(--card-bg); color: var(--text-color); }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 8px; }
        .list-item-info { display: flex; flex-direction: column; gap: 2px; }
        .list-item-actions { display: flex; gap: 8px; }
        .back-btn { margin-bottom: 16px; }
        .step-connector { text-align: center; padding: 8px; color: var(--text-muted); font-size: 20px; }
        .trigger-icon { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; margin-right: 8px; }
        .trigger-record { background: #dbeafe; }
        .trigger-schedule { background: #fef3c7; }
        .trigger-webhook { background: #e0e7ff; }
        .trigger-manual { background: #d1fae5; }
        .wf-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .wf-active { background: #d1fae5; color: #065f46; }
        .wf-inactive { background: #f3f4f6; color: #6b7280; }
        .wf-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>CRM</h2></div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-btn"><span class="nav-icon">◫</span><span class="nav-label">Канбан</span></a>
                <a href="/#payments" class="nav-btn"><span class="nav-icon">≡</span><span class="nav-label">Оплаты</span></a>
                <a href="/#clients" class="nav-btn"><span class="nav-icon">👥</span><span class="nav-label">Клиенты</span></a>
                <a href="/#dashboard" class="nav-btn"><span class="nav-icon">📊</span><span class="nav-label">Дашборд</span></a>
                <a href="/settings.html" class="nav-btn active"><span class="nav-icon">⚙</span><span class="nav-label">Настройки</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="/admin" class="admin-link-btn" target="_blank">Админ-панель</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="settings-page">
                <h1>Настройки</h1>

                <div class="settings-tabs">
                    <button class="settings-tab active" onclick="switchTab('objects')">Кастомные объекты</button>
                    <button class="settings-tab" onclick="switchTab('workflows')">Воркфлоу</button>
                    <button class="settings-tab" onclick="switchTab('email')">Почта</button>
                </div>

                <div class="settings-content">

                    <!-- === КАСТОМНЫЕ ОБЪЕКТЫ === -->
                    <div id="tab-objects" class="settings-pane active">
                        <div id="obj-list-view">
                            <div class="section-card">
                                <h2>Создать объект</h2>
                                <div class="form-row">
                                    <input type="text" id="obj-label" placeholder="Название (Товар)" style="flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--card-bg);color:var(--text-color);">
                                    <input type="text" id="obj-name" placeholder="Имя (product)" style="flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--card-bg);color:var(--text-color);">
                                    <button class="btn btn-primary" onclick="ObjAPI.create()">Создать</button>
                                </div>
                            </div>
                            <div id="objects-container"></div>
                        </div>

                        <div id="obj-detail-view" class="hidden">
                            <button class="btn btn-secondary back-btn" onclick="ObjAPI.backToList()">← Назад</button>
                            <h2 id="obj-detail-title"></h2>
                            <div class="section-card">
                                <h3>Поля</h3>
                                <div class="form-row">
                                    <input type="text" id="field-label" placeholder="Название поля" style="flex:1;min-width:150px;padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--card-bg);color:var(--text-color);">
                                    <input type="text" id="field-name" placeholder="Имя (латиницей)" style="flex:1;min-width:150px;padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--card-bg);color:var(--text-color);">
                                    <select id="field-type" style="padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--card-bg);color:var(--text-color);">
                                        <option value="text">Текст</option>
                                        <option value="number">Число</option>
                                        <option value="select">Выбор</option>
                                        <option value="date">Дата</option>
                                        <option value="currency">Валюта</option>
                                        <option value="boolean">Да/Нет</option>
                                    </select>
                                    <button class="btn btn-primary" onclick="ObjAPI.addField()">Добавить</button>
                                </div>
                                <div id="fields-container"></div>
                            </div>
                            <div class="section-card">
                                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                                    <h3 style="margin:0">Записи</h3>
                                    <button class="btn btn-primary btn-sm" onclick="ObjAPI.showNewRecord()">+ Новая запись</button>
                                </div>
                                <div id="new-record-form" class="hidden" style="padding:16px;background:var(--bg-color);border-radius:var(--radius-md);margin-bottom:12px;"></div>
                                <div id="records-container"></div>
                            </div>
                        </div>
                    </div>

                    <!-- === ВОРКФЛОУ === -->
                    <div id="tab-workflows" class="settings-pane">
                        <div id="wf-list-view">
                            <div class="section-card">
                                <h2>Создать воркфлоу</h2>
                                <div class="form-row">
                                    <input type="text" id="wf-name" placeholder="Название (Уведомление о заказе)" style="flex:1;min-width:300px;padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--card-bg);color:var(--text-color);">
                                    <button class="btn btn-primary" onclick="WfAPI.create()">Создать</button>
                                </div>
                            </div>
                            <div id="workflows-container"></div>
                        </div>

                        <div id="wf-detail-view" class="hidden">
                            <button class="btn btn-secondary back-btn" onclick="WfAPI.backToList()">← Назад</button>
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                                <h2 id="wf-detail-title" style="margin:0"></h2>
                                <div style="display:flex;gap:8px;">
                                    <button id="wf-toggle-btn" class="btn btn-success btn-sm" onclick="WfAPI.toggleActive()">Включить</button>
                                    <button class="btn btn-danger btn-sm" onclick="WfAPI.deleteWf()">Удалить</button>
                                </div>
                            </div>
                            <div class="section-card">
                                <h3>Триггеры</h3>
                                <div class="form-row">
                                    <select id="tr-type" style="padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--card-bg);color:var(--text-color);">
                                        <option value="record_event">Изменение записи</option>
                                        <option value="manual">Ручной запуск</option>
                                        <option value="schedule">По расписанию</option>
                                        <option value="webhook">Webhook</option>
                                    </select>
                                    <select id="tr-object" style="padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--card-bg);color:var(--text-color);">
                                        <option value="card">Сделка</option><option value="client">Клиент</option><option value="payment">Оплата</option>
                                    </select>
                                    <select id="tr-event" style="padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--card-bg);color:var(--text-color);">
                                        <option value="created">Создана</option><option value="updated">Обновлена</option><option value="deleted">Удалена</option>
                                    </select>
                                    <button class="btn btn-primary btn-sm" onclick="WfAPI.addTrigger()">Добавить</button>
                                </div>
                                <div id="triggers-container"></div>
                            </div>
                            <div class="section-card">
                                <h3>Шаги</h3>
                                <div class="form-row">
                                    <select id="st-type" style="padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--card-bg);color:var(--text-color);">
                                        <option value="action">Действие</option><option value="condition">Условие</option><option value="delay">Задержка</option>
                                    </select>
                                    <select id="st-action" style="padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--card-bg);color:var(--text-color);">
                                        <option value="create_record">Создать запись</option><option value="update_record">Обновить запись</option>
                                        <option value="send_email">Отправить email</option><option value="http_request">HTTP-запрос</option>
                                    </select>
                                    <input type="text" id="st-config" placeholder="Параметры (JSON)" style="flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--card-bg);color:var(--text-color);">
                                    <button class="btn btn-primary btn-sm" onclick="WfAPI.addStep()">Добавить</button>
                                </div>
                                <div id="steps-container"></div>
                            </div>
                            <div class="section-card">
                                <h3>Последние запуски</h3>
                                <div id="runs-container"></div>
                            </div>
                        </div>
                    </div>

                    <!-- === ПОЧТА === -->
                    <div id="tab-email" class="settings-pane">
                        <div class="section-card">
                            <h2>Настройки IMAP</h2>
                            <div class="form-group">
                                <label>IMAP-сервер</label>
                                <input type="text" id="email-imap" placeholder="imap.yandex.ru" value="imap.yandex.ru">
                            </div>
                            <div class="form-group">
                                <label>Электронная почта</label>
                                <input type="email" id="email-user" placeholder="email@yandex.ru">
                            </div>
                            <div class="form-group">
                                <label>Пароль приложения</label>
                                <input type="password" id="email-pass" placeholder="Пароль приложения">
                            </div>
                            <div class="form-group">
                                <label>Колонка для новых лидов</label>
                                <select id="email-target">
                                    <option value="Новый запрос">Новый запрос</option>
                                    <option value="В работе">В работе</option>
                                    <option value="Ждет оплаты">Ждет оплаты</option>
                                    <option value="Сборка">Сборка</option>
                                </select>
                            </div>
                            <button class="btn btn-primary" onclick="EmailAPI.save()">Сохранить настройки</button>
                        </div>
                        <div class="section-card">
                            <h2>Синхронизация</h2>
                            <div id="email-status"><p>Статус: <span id="email-status-text">—</span></p></div>
                            <button class="btn btn-primary" onclick="EmailAPI.sync()" style="margin-top:12px">Проверить почту и импортировать</button>
                            <div id="email-results" style="margin-top:16px;"></div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script>
    // === УТИЛИТЫ ===
    function escapeHtml(v) { return v === null || v === undefined ? '' : String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function showToast(msg, type) { const t = document.createElement('div'); t.className = `toast toast-${type||'info'}`; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
    async function apiFetch(path, opts = {}) {
        let token; try { token = localStorage.getItem('crm_token'); } catch(e) {}
        const h = { ...opts.headers };
        if (!(opts.body instanceof FormData)) h['Content-Type'] = 'application/json';
        if (token) h['Authorization'] = `Bearer ${token}`;
        const r = await fetch(path, { ...opts, headers: h });
        if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || 'Ошибка'); }
        return r.json();
    }

    // === ТАБЫ ===
    function switchTab(tab) {
        document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.settings-pane').forEach(p => p.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('tab-' + tab).classList.add('active');
    }

    // === ОБЪЕКТЫ ===
    let curObj = null, curFields = [], curRecords = [];
    const ObjAPI = {
        async load() {
            const objs = await apiFetch('/custom/objects');
            const c = document.getElementById('objects-container');
            c.innerHTML = objs.length === 0 ? '<p style="color:var(--text-muted);text-align:center;padding:20px;">Нет объектов</p>' : '';
            objs.forEach(o => {
                const d = document.createElement('div'); d.className = 'list-item';
                d.innerHTML = `<div class="list-item-info"><strong>${escapeHtml(o.label)}</strong><span style="color:var(--text-muted);font-size:12px">${escapeHtml(o.name)}</span></div>
                <div class="list-item-actions"><button class="btn btn-secondary btn-sm" onclick="ObjAPI.open(${o.id})">Открыть</button><button class="btn btn-danger btn-sm" onclick="ObjAPI.del(${o.id},'${escapeHtml(o.name)}')">Удалить</button></div>`;
                c.appendChild(d);
            });
        },
        async create() {
            const label = document.getElementById('obj-label').value.trim();
            const name = document.getElementById('obj-name').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'_');
            if (!label || !name) { showToast('Заполните все поля','error'); return; }
            await apiFetch('/custom/objects', { method:'POST', body:JSON.stringify({name,label}) });
            document.getElementById('obj-label').value=''; document.getElementById('obj-name').value='';
            showToast('Создано','success'); await this.load();
        },
        async del(id, name) { if (!confirm(`Удалить "${name}"?`)) return; await apiFetch(`/custom/objects/${id}`,{method:'DELETE'}); showToast('Удалено','success'); await this.load(); },
        async open(id) {
            const objs = await apiFetch('/custom/objects'); curObj = objs.find(o=>o.id===id);
            document.getElementById('obj-list-view').classList.add('hidden');
            document.getElementById('obj-detail-view').classList.remove('hidden');
            document.getElementById('obj-detail-title').textContent = curObj.label;
            await this.loadFields(); await this.loadRecords();
        },
        backToList() { curObj=null; document.getElementById('obj-list-view').classList.remove('hidden'); document.getElementById('obj-detail-view').classList.add('hidden'); },
        async loadFields() { curFields = await apiFetch(`/custom/objects/${curObj.id}/fields`); const c=document.getElementById('fields-container'); c.innerHTML=''; curFields.forEach(f=>{const d=document.createElement('div');d.className='list-item';d.innerHTML=`<span><b>${escapeHtml(f.label)}</b> <span style="color:var(--text-muted);font-size:12px">(${escapeHtml(f.name)}, ${f.field_type})</span></span><button class="btn btn-danger btn-sm" onclick="ObjAPI.delField(${f.id})">Удалить</button>`;c.appendChild(d);}); },
        async addField() { const label=document.getElementById('field-label').value.trim(),name=document.getElementById('field-name').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'_'),type=document.getElementById('field-type').value; if(!label||!name){showToast('Заполните все поля','error');return;} await apiFetch(`/custom/objects/${curObj.id}/fields`,{method:'POST',body:JSON.stringify({name,label,field_type:type,position:curFields.length})}); document.getElementById('field-label').value='';document.getElementById('field-name').value='';showToast('Поле добавлено','success');await this.loadFields(); },
        async delField(id) { if(!confirm('Удалить поле?'))return; await apiFetch(`/custom/fields/${id}`,{method:'DELETE'}); showToast('Удалено','success'); await this.loadFields(); },
        async loadRecords() { curRecords = await apiFetch(`/custom/objects/${curObj.id}/records`); const c=document.getElementById('records-container'); if(curFields.length===0){c.innerHTML='<p style="color:var(--text-muted);text-align:center;padding:20px;">Добавьте поля</p>';return;} if(curRecords.length===0){c.innerHTML='<p style="color:var(--text-muted);text-align:center;padding:20px;">Нет записей</p>';return;} let h='<table style="width:100%;border-collapse:collapse;"><thead><tr>';curFields.forEach(f=>{h+=`<th style="padding:8px;text-align:left;border-bottom:2px solid var(--border-color);font-size:13px;color:var(--text-muted);">${escapeHtml(f.label)}</th>`;});h+='<th style="padding:8px;"></th></tr></thead><tbody>';curRecords.forEach(r=>{h+='<tr>';curFields.forEach(f=>{const v=r.data[f.name];let d='';if(v!==undefined&&v!==null){if(f.field_type==='boolean')d=v?'✓':'✕';else if(f.field_type==='currency')d=Number(v).toLocaleString('ru-RU')+' BYN';else d=escapeHtml(String(v));}h+=`<td style="padding:8px;border-bottom:1px solid var(--border-color);">${d}</td>`;});h+=`<td style="padding:8px;border-bottom:1px solid var(--border-color);"><button class="btn btn-danger btn-sm" onclick="ObjAPI.delRecord(${r.id})">✕</button></td></tr>`;});h+='</tbody></table>';c.innerHTML=h; },
        showNewRecord() { const f=document.getElementById('new-record-form'); f.classList.toggle('hidden'); if(!f.classList.contains('hidden')){f.innerHTML='';curFields.forEach(inp=>{let i='';if(inp.field_type==='boolean')i=`<input type="checkbox" id="rf-${inp.id}">`;else if(inp.field_type==='date')i=`<input type="date" id="rf-${inp.id}">`;else if(inp.field_type==='number'||inp.field_type==='currency')i=`<input type="number" step="0.01" id="rf-${inp.id}">`;else i=`<input type="text" id="rf-${inp.id}">`;f.innerHTML+=`<div class="form-group"><label>${escapeHtml(inp.label)}</label>${i}</div>`;});f.innerHTML+='<button class="btn btn-primary" onclick="ObjAPI.createRecord()" style="margin-top:8px">Создать</button>';} },
        async createRecord() { const data={};curFields.forEach(f=>{const el=document.getElementById(`rf-${f.id}`);if(!el)return;if(f.field_type==='boolean')data[f.name]=el.checked;else if(f.field_type==='number'||f.field_type==='currency')data[f.name]=el.value?parseFloat(el.value):null;else data[f.name]=el.value||null;}); await apiFetch(`/custom/objects/${curObj.id}/records`,{method:'POST',body:JSON.stringify({data})}); showToast('Создано','success');document.getElementById('new-record-form').classList.add('hidden');await this.loadRecords(); },
        async delRecord(id) { if(!confirm('Удалить?'))return; await apiFetch(`/custom/records/${id}`,{method:'DELETE'}); showToast('Удалено','success'); await this.loadRecords(); }
    };

    // === ВОРКФЛОУ ===
    let curWf = null;
    const WfAPI = {
        async load() {
            const wfs = await apiFetch('/workflows');
            const c = document.getElementById('workflows-container');
            c.innerHTML = wfs.length === 0 ? '<p style="color:var(--text-muted);text-align:center;padding:20px;">Нет воркфлоу</p>' : '';
            wfs.forEach(w => {
                const d = document.createElement('div'); d.className = 'wf-item';
                d.innerHTML = `<div><strong>${escapeHtml(w.name)}</strong><br><span style="color:var(--text-muted);font-size:12px">${escapeHtml(w.description||'')}</span></div>
                <div style="display:flex;gap:8px;align-items:center"><span class="wf-badge ${w.is_active?'wf-active':'wf-inactive'}">${w.is_active?'Активен':'Выкл'}</span><button class="btn btn-secondary btn-sm" onclick="WfAPI.open(${w.id})">Открыть</button></div>`;
                c.appendChild(d);
            });
        },
        async create() { const name=document.getElementById('wf-name').value.trim(); if(!name){showToast('Введите название','error');return;} await apiFetch('/workflows',{method:'POST',body:JSON.stringify({name})}); document.getElementById('wf-name').value='';showToast('Создано','success');await this.load(); },
        async open(id) { const wfs=await apiFetch('/workflows');curWf=wfs.find(w=>w.id===id); document.getElementById('wf-list-view').classList.add('hidden');document.getElementById('wf-detail-view').classList.remove('hidden');document.getElementById('wf-detail-title').textContent=curWf.name;document.getElementById('wf-toggle-btn').textContent=curWf.is_active?'Выключить':'Включить'; await this.loadTriggers();await this.loadSteps();await this.loadRuns(); },
        backToList() { curWf=null;document.getElementById('wf-list-view').classList.remove('hidden');document.getElementById('wf-detail-view').classList.add('hidden'); },
        async toggleActive() { await apiFetch(`/workflows/${curWf.id}`,{method:'PATCH',body:JSON.stringify({is_active:!curWf.is_active})}); curWf.is_active=!curWf.is_active;document.getElementById('wf-toggle-btn').textContent=curWf.is_active?'Выключить':'Включить';showToast(curWf.is_active?'Включён':'Выключен','success'); },
        async deleteWf() { if(!confirm('Удалить?'))return; await apiFetch(`/workflows/${curWf.id}`,{method:'DELETE'});showToast('Удалено','success');this.backToList();await this.load(); },
        async loadTriggers() { const ts=await apiFetch(`/workflows/${curWf.id}/triggers`);const c=document.getElementById('triggers-container');c.innerHTML='';const icons={record_event:'📋',schedule:'⏰',webhook:'🌐',manual:'👆'};const cls={record_event:'trigger-record',schedule:'trigger-schedule',webhook:'trigger-webhook',manual:'trigger-manual'};const lbl={record_event:'Изменение записи',schedule:'По расписанию',webhook:'Webhook',manual:'Ручной'};const obj={card:'Сделка',client:'Клиент',payment:'Оплата'};const evt={created:'создана',updated:'обновлена',deleted:'удалена'};ts.forEach(t=>{const cfg=t.config||{};const d=document.createElement('div');d.className='list-item';d.innerHTML=`<div style="display:flex;align-items:center;"><span class="trigger-icon ${cls[t.trigger_type]||''}">${icons[t.trigger_type]||'?'}</span><strong>${lbl[t.trigger_type]||t.trigger_type}</strong>${cfg.object?` <span style="color:var(--text-muted);font-size:12px"> — ${obj[cfg.object]||cfg.object} ${evt[cfg.event]||''}</span>`:''}</div><button class="btn btn-danger btn-sm" onclick="WfAPI.delTrigger(${t.id})">Удалить</button>`;c.appendChild(d);}); },
        async addTrigger() { const type=document.getElementById('tr-type').value;const cfg={};if(type==='record_event'){cfg.object=document.getElementById('tr-object').value;cfg.event=document.getElementById('tr-event').value;} await apiFetch(`/workflows/${curWf.id}/triggers`,{method:'POST',body:JSON.stringify({trigger_type:type,config:cfg})});showToast('Добавлено','success');await this.loadTriggers(); },
        async delTrigger(id) { if(!confirm('Удалить?'))return;await apiFetch(`/workflows/triggers/${id}`,{method:'DELETE'});showToast('Удалено','success');await this.loadTriggers(); },
        async loadSteps() { const ss=await apiFetch(`/workflows/${curWf.id}/steps`);const c=document.getElementById('steps-container');c.innerHTML='';const icons={create_record:'➕',update_record:'✏️',send_email:'📧',http_request:'🌐'};const al={create_record:'Создать запись',update_record:'Обновить',send_email:'Email',http_request:'HTTP'};ss.forEach((s,i)=>{if(i>0){const conn=document.createElement('div');conn.className='step-connector';conn.textContent='↓';c.appendChild(conn);}const d=document.createElement('div');d.className='list-item';d.innerHTML=`<div style="display:flex;align-items:center;gap:8px;"><span style="color:var(--text-muted);font-size:13px">#${i+1}</span><span>${icons[s.action_type]||'⚡'} <strong>${s.step_type}</strong> — ${al[s.action_type]||s.action_type}</span></div><button class="btn btn-danger btn-sm" onclick="WfAPI.delStep(${s.id})">Удалить</button>`;c.appendChild(d);}); },
        async addStep() { const st=document.getElementById('st-type').value,sa=document.getElementById('st-action').value;let cfg={};const cs=document.getElementById('st-config').value.trim();if(cs){try{cfg=JSON.parse(cs);}catch(e){showToast('Неверный JSON','error');return;}} const steps=await apiFetch(`/workflows/${curWf.id}/steps`);await apiFetch(`/workflows/${curWf.id}/steps`,{method:'POST',body:JSON.stringify({step_type:st,action_type:sa,config:cfg,position:steps.length})});document.getElementById('st-config').value='';showToast('Добавлено','success');await this.loadSteps(); },
        async delStep(id) { if(!confirm('Удалить?'))return;await apiFetch(`/workflows/steps/${id}`,{method:'DELETE'});showToast('Удалено','success');await this.loadSteps(); },
        async loadRuns() { const rs=await apiFetch(`/workflows/${curWf.id}/runs`);const c=document.getElementById('runs-container');if(rs.length===0){c.innerHTML='<p style="color:var(--text-muted);text-align:center;padding:12px;">Запусков пока нет</p>';return;} c.innerHTML='';rs.forEach(r=>{const sc=r.status==='completed'?'background:#d1fae5;color:#065f46':r.status==='failed'?'background:#fee2e2;color:#991b1b':'background:#fef3c7;color:#92400e';const d=document.createElement('div');d.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border-color);';d.innerHTML=`<span>${r.started_at?new Date(r.started_at).toLocaleString('ru-RU'):'—'}</span><span style="padding:4px 8px;border-radius:4px;font-size:12px;font-weight:600;${sc}">${r.status}</span>${r.error?`<span style="color:var(--danger-color);font-size:12px">${escapeHtml(r.error)}</span>`:''}`;c.appendChild(d);}); }
    };

    // === ПОЧТА ===
    const EmailAPI = {
        async save() {
            const settings = {
                imap_server: document.getElementById('email-imap').value,
                username: document.getElementById('email-user').value,
                password: document.getElementById('email-pass').value,
                target_status: document.getElementById('email-target').value
            };
            await apiFetch('/email-parser/settings', { method: 'POST', body: JSON.stringify(settings) });
            showToast('Настройки сохранены', 'success');
        },
        async sync() {
            showToast('Синхронизация...', 'info');
            const r = await apiFetch('/email-parser/sync', { method: 'POST' });
            document.getElementById('email-status-text').textContent = new Date().toLocaleString('ru-RU');
            document.getElementById('email-results').innerHTML = `<p style="margin-top:8px;">Импортировано: <strong>${r.imported || 0}</strong> писем</p>`;
            showToast('Синхронизация завершена', 'success');
        },
        async loadSettings() {
            try {
                const s = await apiFetch('/email-parser/settings');
                if (s.imap_server) document.getElementById('email-imap').value = s.imap_server;
                if (s.username) document.getElementById('email-user').value = s.username;
                if (s.target_status) document.getElementById('email-target').value = s.target_status;
            } catch(e) {}
        }
    };

    // ИНИЦИАЛИЗАЦИЯ
    document.addEventListener('DOMContentLoaded', () => {
        ObjAPI.load();
        WfAPI.load();
        EmailAPI.loadSettings();
    });
    </script>
</body>
</html>
