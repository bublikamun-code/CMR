services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: crm-backend
    restart: unless-stopped
    env_file: .env.local
    ports:
      - "8000:8000"
    volumes:
      # Data only. The volume must NOT be mounted at /app - that would shadow the
      # application code from the image and freeze the app at its first-run version.
      - crm-data:/app/data
      - ./server_snapshot/uploads:/app/uploads
      - ./server_snapshot/logs:/app/logs
    networks:
      - crm-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: crm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - crm-network

volumes:
  crm-data:
    driver: local

networks:
  crm-network:
    driver: bridge
